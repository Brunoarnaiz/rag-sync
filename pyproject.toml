[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rag-sync"
version = "0.1.0"
description = "Keep your RAG index in sync with your database: re-embed only what changed, drop what's gone."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Bruno Arnaiz" }]
keywords = ["rag", "embeddings", "pgvector", "postgres", "supabase", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rag-sync = "rag_sync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_sync"]
